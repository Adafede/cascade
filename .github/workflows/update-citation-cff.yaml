# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - DESCRIPTION
      - inst/CITATION
  workflow_dispatch:

name: Update CITATION.cff
permissions:
  contents: write

jobs:
  update-citation-cff:
    runs-on: macos-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          extra-packages: |
            any::cffr
            any::V8

      - name: Update CITATION.cff
        shell: Rscript {0}
        run: |
          library(cffr)
          cff_write(keys = list())

      - name: Commit results
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CITATION.cff
          if [ -n "$(git status --porcelain CITATION.cff)" ]; then
            git commit -m 'Update CITATION.cff'
            git push origin
          fi
