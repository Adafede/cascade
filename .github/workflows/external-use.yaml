---
name: External Use
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch: null
permissions: read-all
jobs:
  cascade-test:
    name: cascade-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          update-rtools: true

      - name: Install dependencies (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            libarchive-dev libcurl4-openssl-dev libfribidi-dev libharfbuzz-dev \
            libnetcdf-dev libssl-dev libuv1-dev pkg-config \
          && sudo apt-get clean \
          && sudo rm -rf /var/lib/apt/lists/*

      - name: Install dependencies (macOS)
        if: contains(matrix.os, 'macos')
        run: |
          brew update
          brew install libomp netcdf
          GETTEXT_PREFIX="$(brew --prefix gettext)"
          LIBOMP_PREFIX="$(brew --prefix libomp)"
          NETCDF_PREFIX="$(brew --prefix netcdf)"
          echo "CPPFLAGS+=-I$GETTEXT_PREFIX/include" >> $GITHUB_ENV
          echo "LDFLAGS+=-L$GETTEXT_PREFIX/lib" >> $GITHUB_ENV

      - name: Install dependencies (Windows)
        if: contains(matrix.os, 'windows')
        run: true

      - name: Install
        run: >
          install.packages(
          "cascade",
          repos = c(
          "https://adafede.r-universe.dev",
          "https://taxonomicallyinformedannotation.r-universe.dev",
          "https://cran.r-universe.dev",
          "https://bioc.r-universe.dev"
          )
          )
        shell: Rscript {0}

      - name: Run pipeline
        run: |
          cascade::check_chromatograms_alignment(show_example = TRUE)
          cascade::check_peaks_integration(show_example = TRUE)
          cascade::process_compare_peaks(show_example = TRUE)
          cascade::generate_pseudochromatograms(show_example = TRUE)
          cascade::generate_tables(show_example = TRUE)
          cascade::generate_ids()
        shell: Rscript {0}
