---
name: External Use
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: null
permissions: read-all
jobs:
  cascade-test:
    name: cascade-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          use-public-rspm: true

      - name: Install dependencies (macOS)
        if: contains(matrix.os, 'macos')
        run: |
          brew update
          brew install netcdf
          GETTEXT_PREFIX="$(brew --prefix gettext)"
          mkdir -p ~/.R
          cat >> ~/.R/Makevars <<EOF
          CPPFLAGS += -I${GETTEXT_PREFIX}/include
          LDFLAGS  += -L${GETTEXT_PREFIX}/lib -lintl
          EOF

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          extra-packages: any::pak

      - name: Install local package
        shell: Rscript {0}
        run: pak::local_install(".", ask = FALSE)

      - name: Run deterministic example pipeline
        shell: Rscript {0}
        run: |
          cascade::check_chromatograms_alignment(show_example = TRUE)
          cascade::check_peaks_integration(show_example = TRUE)
          cascade::process_compare_peaks(show_example = TRUE)
          cascade::generate_pseudochromatograms(show_example = TRUE)
          cascade::prepare_tima_annotations(show_example = TRUE) |>
            cascade::plot_tima()
